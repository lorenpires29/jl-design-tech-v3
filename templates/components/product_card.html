<article class="product"><a class="product-image" href="{% url 'produto_detalhe' produto.slug %}">{% if produto.imagem %}<img src="{{ produto.imagem.url }}" alt="{{ produto.nome }}" loading="lazy">{% else %}<span>JL ✦</span>{% endif %}</a><div class="product-content"><small>{{ produto.categoria.nome }}</small><h3>{{ produto.nome }}</h3><strong>{% if produto.preco_referencia is not None %}R$ {{ produto.preco_referencia|floatformat:2 }}{% else %}Sob consulta{% endif %}</strong><a class="btn outline" href="{% url 'produto_detalhe' produto.slug %}">Ver detalhes →</a></div></article>
