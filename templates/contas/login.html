{% extends 'base.html' %}{% block title %}Entrar · JL Design Tech{% endblock %}{% block content %}<section class="wrap page"><div class="tile auth-panel"><span class="eyebrow">ACESSO SEGURO</span><h1>Entrar na <em>conta</em></h1><form method="post" class="form">{% csrf_token %}{{ form.non_field_errors }}<label for="{{ form.username.id_for_label }}">Usuário</label>{{ form.username }}<label for="{{ form.password.id_for_label }}">Senha</label>{{ form.password }}<input type="hidden" name="next" value="{{ next }}"><button type="submit" class="btn primary">Entrar</button></form><p><a class="back" href="{% url 'password_reset' %}">Esqueci minha senha</a></p><p><a class="back" href="{% url 'cadastro' %}">Criar conta</a></p></div></section>{% endblock %}
